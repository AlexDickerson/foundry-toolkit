# foundry-toolkit compose stack
# Four services on one internal network: Caddy (TLS), Foundry VTT, foundry-mcp, player-portal.
#
# Usage (from this deploy/ directory):
#   cp .env.example .env   # fill in credentials
#   docker compose up -d
#
# To pull a specific version instead of :latest, set IMAGE_TAG in .env.
# See README.md for full documentation, including TLS/Caddy prerequisites.

name: foundry-toolkit

services:
  # ── Caddy (TLS reverse proxy) ────────────────────────────────────────────────
  # Terminates HTTPS via Let's Encrypt (HTTP-01 challenge).
  # Routes: /foundry* → foundry:30000, everything else → player-portal:3000.
  # Cert state is persisted in the caddy_data volume — do not delete it unless
  # you intend to re-issue (Let's Encrypt rate limits apply).
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

  # ── Foundry VTT ─────────────────────────────────────────────────────────────
  # felddy/foundryvtt base image with the foundry-api-bridge module baked in.
  # The module is seeded into /data/Data/modules/ on first boot.
  # A v13-pinned image variant is also published at:
  #   ghcr.io/alexdickerson/foundry-toolkit-foundry-v13:${IMAGE_TAG:-latest}
  # Swap the image: line below to use the v13 variant for Foundry v13 compatibility.
  foundry:
    image: ghcr.io/alexdickerson/foundry-toolkit-foundry:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      FOUNDRY_USERNAME: ${FOUNDRY_USERNAME}
      FOUNDRY_PASSWORD: ${FOUNDRY_PASSWORD}
      FOUNDRY_ADMIN_KEY: ${FOUNDRY_ADMIN_KEY:-}
      # Route prefix so Foundry generates URLs under /foundry/... — must match
      # the Caddyfile path matcher.  Set to empty in .env to disable (direct access).
      FOUNDRY_ROUTE_PREFIX: ${FOUNDRY_ROUTE_PREFIX:-foundry}
    volumes:
      - foundry-data:/data
    ports:
      # Bound to 127.0.0.1 only — lets the GM reach Foundry directly without
      # going through Caddy, without exposing the port to the public internet.
      - '127.0.0.1:30000:30000'
    networks:
      - internal

  # ── foundry-mcp ─────────────────────────────────────────────────────────────
  # MCP server + Fastify REST surface.  The foundry-api-bridge module (running
  # in the GM's browser tab) dials OUT to ws://<host>:8765/foundry — port 8765
  # is not mapped by default.  Add a port mapping or reverse-proxy entry if you
  # need the module to reach this service from outside the compose network.
  foundry-mcp:
    image: ghcr.io/alexdickerson/foundry-toolkit-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SHARED_SECRET: ${SHARED_SECRET}
      ALLOW_EVAL: ${ALLOW_EVAL:-0}
      HOST: 0.0.0.0
      PORT: '8765'
      # foundry-mcp needs read access (compendium packs) and write access
      # (upload_asset writes map images into Data/maps/ when pushing scenes).
      FOUNDRY_DATA: /foundry-data
      # Optional: directory of PDF files served as /books/* to player-portal.
      # Mount a host path via compose.override.yaml:
      #   services:
      #     foundry-mcp:
      #       volumes:
      #         - /your/host/books:/books
      #       environment:
      #         FOUNDRY_MCP_BOOKS_DIR: /books
      FOUNDRY_MCP_BOOKS_DIR: ${FOUNDRY_MCP_BOOKS_DIR:-}
    volumes:
      - foundry-data:/foundry-data
    depends_on:
      - foundry
    networks:
      - internal

  # ── headless-bridge ─────────────────────────────────────────────────────────
  # Headless Chromium process that logs into Foundry as a dedicated GM account
  # and holds the page open 24/7, keeping foundry-api-bridge connected to
  # foundry-mcp without requiring a browser tab to stay open.
  #
  # Requires a dedicated Foundry user with Gamemaster role (e.g. "bridge-gm").
  # Do NOT reuse your primary GM account — Foundry allows only one active
  # session per user; logging in as the same GM will kick the other session.
  #
  # To build locally (from the monorepo root):
  #   docker build -f deploy/Dockerfile.headless-bridge \
  #     -t foundry-toolkit-headless-bridge:dev .
  headless-bridge:
    image: ghcr.io/alexdickerson/foundry-toolkit-headless-bridge:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      FOUNDRY_URL: http://foundry:30000
      FOUNDRY_ROUTE_PREFIX: ${FOUNDRY_ROUTE_PREFIX:-}
      FOUNDRY_ADMIN_KEY: ${FOUNDRY_ADMIN_KEY:-}
      FOUNDRY_MCP_URL: http://foundry-mcp:8765
      BRIDGE_GM_USER: ${BRIDGE_GM_USER}
      BRIDGE_GM_PASS: ${BRIDGE_GM_PASS:-}
      BRIDGE_WORLD_ID: ${BRIDGE_WORLD_ID}
    mem_limit: 768m
    depends_on:
      - foundry
      - foundry-mcp
    networks:
      - internal

  # ── quartz (Obsidian notes) ──────────────────────────────────────────────────
  # Quartz v4 static site generator.  Watches the vault directory (mounted
  # read-only from the host) and rebuilds on change.  The generated site is
  # served at :8080/notes/* on the internal network only — player-portal
  # reverse-proxies /notes/* here so notes are gated by the portal's auth.
  #
  # Populate the vault by rsyncing your Obsidian vault to the host path set in
  # QUARTZ_VAULT_DIR.  Only notes with `publish: true` in their frontmatter
  # appear in the built site (configured via ExplicitPublish in quartz.config.ts).
  quartz:
    image: ghcr.io/alexdickerson/foundry-toolkit-quartz:${IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      # QUARTZ_VAULT_DIR: host path to the directory you rsync your Obsidian
      # vault to.  Docker creates the path if it does not exist, giving Quartz
      # an empty vault that renders an empty site until notes are rsynced in.
      - ${QUARTZ_VAULT_DIR:-/var/quartz-vault}:/vault:ro
    networks:
      - internal
    mem_limit: 512m

  # ── player-portal ────────────────────────────────────────────────────────────
  # Fastify server that serves the Vite SPA and reverse-proxies:
  #   /api/mcp/*              → foundry-mcp (MCP REST surface)
  #   /icons /systems /worlds → foundry (asset resolution for prepared actors)
  #   /notes/*                → quartz (Obsidian notes, auth-gated)
  # Port 3000 is not mapped to the host — Caddy routes traffic here via the
  # compose internal network.  No direct external access needed.
  player-portal:
    image: ghcr.io/alexdickerson/foundry-toolkit-portal:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SHARED_SECRET: ${SHARED_SECRET}
      SECURE_SESSION_SECRET: ${SECURE_SESSION_SECRET:-}
      MCP_URL: http://foundry-mcp:8765
      FOUNDRY_URL: http://foundry:30000
      QUARTZ_URL: http://quartz:8080
      PORT: '3000'
      HOST: 0.0.0.0
    depends_on:
      - foundry-mcp
      - quartz
    networks:
      - internal

volumes:
  foundry-data:
  caddy_data:
  caddy_config:

# Inline Caddyfile — no host file needed, works with Portainer and plain compose.
# Edit the content block below to change routing rules.
configs:
  caddyfile:
    content: |
      addnd.net {
        handle /foundry* {
          reverse_proxy foundry:30000
        }
        handle {
          reverse_proxy player-portal:3000
        }
      }

networks:
  internal:
