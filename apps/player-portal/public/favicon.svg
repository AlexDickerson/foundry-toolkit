<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#1a1a2e"/>

  <!-- D20 icosahedron front-facing triangle -->
  <g stroke="#e8d4a0" stroke-width="1.5" fill="none">
    <!-- Main triangle outline -->
    <polygon points="50,15 85,80 15,80" />

    <!-- Interior edges for depth perception -->
    <line x1="50" y1="15" x2="50" y2="48" />
    <line x1="50" y1="48" x2="32" y2="73" />
    <line x1="50" y1="48" x2="68" y2="73" />
    <line x1="32" y1="73" x2="68" y2="73" />
  </g>

  <!-- Number "20" in center -->
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#e8d4a0" text-anchor="middle" dominant-baseline="middle">20</text>
</svg>
